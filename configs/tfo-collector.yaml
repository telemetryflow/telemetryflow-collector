# =============================================================================
# TelemetryFlow Collector Configuration — OTLP Ingest + TFO Platform Export
# =============================================================================
# Minimal production config: TFO OTLP receiver (v1 open + v2 authenticated) in,
# TFO Platform exporter (ClickHouse ingestion) out. No K8s enrichment, no
# metric-name transforms, no span-metrics/service-graph, no Prometheus/Sentry.
#
# Full reference (all extensions, processors, connectors, exporters, pipelines):
#   configs/tfo-collector.complete.yaml
# Per-component examples:
#   configs/example/
#
# Usage:
#   1. Copy to /etc/tfo-collector/tfo-collector.yaml
#   2. Set env vars:
#        TELEMETRYFLOW_API_KEY_ID=tfk_xxx
#        TELEMETRYFLOW_API_KEY_SECRET=tfs_xxx
#   3. Start: tfo-collector --config /etc/tfo-collector/tfo-collector.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Extensions — auth + identity + health
# -----------------------------------------------------------------------------
extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

  # API key management for the TFO Platform (v2 endpoints)
  tfoauth:
    api_key_id: "${env:TELEMETRYFLOW_API_KEY_ID}"
    api_key_secret: "${env:TELEMETRYFLOW_API_KEY_SECRET}"

  # Collector identity + resource enrichment
  tfoidentity:
    id: "${env:TELEMETRYFLOW_COLLECTOR_ID}"
    name: "TelemetryFlow Collector"
    tags:
      environment: "${env:TELEMETRYFLOW_ENVIRONMENT:-production}"
    enrich_resources: true

# -----------------------------------------------------------------------------
# Receivers — TFO OTLP in (v1 open, v2 authenticated)
# -----------------------------------------------------------------------------
receivers:
  tfootlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
    # v2 /v2/{traces,metrics,logs} require X-TelemetryFlow-Key-ID/-Secret headers
    enable_v2_endpoints: true
    v2_auth:
      required: true
      validate_secret: false

# -----------------------------------------------------------------------------
# Processors — memory guard, resource tags, batching
# -----------------------------------------------------------------------------
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  resource:
    attributes:
      - key: service.namespace
        value: telemetryflow
        action: upsert
      - key: deployment.environment
        value: "${env:TELEMETRYFLOW_ENVIRONMENT:-production}"
        action: upsert

  batch:
    timeout: 200ms
    send_batch_size: 8192

# -----------------------------------------------------------------------------
# Exporter — TFO Platform (ClickHouse ingestion)
# -----------------------------------------------------------------------------
exporters:
  tfo:
    endpoint: "${env:TELEMETRYFLOW_ENDPOINT:-https://api.telemetryflow.id}"
    use_v2_api: true
    auth:
      extension: tfoauth
    collector_identity: tfoidentity
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    # The tfo exporter implements retry_on_failure only — no sending queue.

# -----------------------------------------------------------------------------
# Service — active components + pipelines
# -----------------------------------------------------------------------------
service:
  extensions: [health_check, tfoauth, tfoidentity]

  pipelines:
    traces:
      receivers: [tfootlp]
      processors: [memory_limiter, resource, batch]
      exporters: [tfo]

    metrics:
      receivers: [tfootlp]
      processors: [memory_limiter, resource, batch]
      exporters: [tfo]

    logs:
      receivers: [tfootlp]
      processors: [memory_limiter, resource, batch]
      exporters: [tfo]

  telemetry:
    logs:
      level: info
      encoding: json

# =============================================================================
# Intentionally omitted (defaults apply) — see tfo-collector.complete.yaml:
#   extensions         — zpages, pprof (debug/profiling)
#   processors         — k8sattributes, groupbyattrs/k8s, transform/cadvisor,
#                        transform/hubble, resource/sentry, attributes/agent
#   connectors         — span_metrics, service_graph (derived trace metrics)
#   exporters          — debug, prometheus, otlphttp/sentry, otlp_grpc, file
#   service.telemetry  — internal Prometheus metrics readers
# =============================================================================
